<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="500" viewBox="0 0 1024 500">
  <!--
    Play feature graphic, 1024x500.

    It is cropped differently in different Play surfaces, so everything that
    must survive sits inside the middle band: no text near the edges, and the
    icon is not the thing carrying the message.

    The watch is drawn, not photographed. A photo-real mock-up of hardware the
    app has only been tried on once would be a claim; a flat drawing of a watch
    face showing the score is a diagram of what the app does.
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A1646"/>
      <stop offset="1" stop-color="#050B24"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0B4DFF" stop-opacity="0.35"/>
      <stop offset="0.5" stop-color="#0B4DFF" stop-opacity="0"/>
      <stop offset="1" stop-color="#E3120B" stop-opacity="0.35"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="500" fill="url(#bg)"/>
  <rect width="1024" height="500" fill="url(#glow)"/>

  <!-- Left: the name and what it is. -->
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="72" y="196" font-size="68" font-weight="bold" fill="#FFFFFF" letter-spacing="-1">POINT<tspan fill="#D7F205">COP</tspan></text>
    <text x="74" y="246" font-size="27" font-weight="bold" fill="#FFFFFF" opacity="0.92" letter-spacing="0.5">MARCADOR DE PÁDEL Y DE TENIS</text>
    <text x="74" y="306" font-size="23" fill="#AFC0E8">El móvil hace de marcador.</text>
    <text x="74" y="340" font-size="23" fill="#AFC0E8">El reloj que llevas puesto, de mando.</text>
    <text x="74" y="408" font-size="19" fill="#7E90BE">Gratis · Sin anuncios · Sin cuenta</text>
  </g>

  <!-- Right: the phone as scoreboard, with the watch echoing the same score. -->
  <g transform="translate(628 86)">
    <rect x="0" y="0" width="300" height="190" rx="16" fill="#000000" stroke="#2A3765" stroke-width="3"/>
    <rect x="12" y="12" width="135" height="126" rx="6" fill="#0B4DFF"/>
    <rect x="153" y="12" width="135" height="126" rx="6" fill="#FFD000"/>
    <text x="79" y="100" font-family="Arial, Helvetica, sans-serif" font-size="74" font-weight="bold" fill="#FFFFFF" text-anchor="middle">15</text>
    <text x="220" y="100" font-family="Arial, Helvetica, sans-serif" font-size="74" font-weight="bold" fill="#000000" text-anchor="middle">30</text>
    <text x="150" y="168" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">SET 1</text>
  </g>

  <!-- The watch: same score, on the wrist. -->
  <g transform="translate(690 288)">
    <rect x="52" y="-14" width="18" height="24" rx="5" fill="#39455E"/>
    <rect x="52" y="104" width="18" height="24" rx="5" fill="#39455E"/>
    <circle cx="61" cy="57" r="56" fill="#111726" stroke="#4A5878" stroke-width="5"/>
    <circle cx="61" cy="57" r="44" fill="#000000"/>
    <text x="61" y="48" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="bold" fill="#0B4DFF" text-anchor="middle">15</text>
    <text x="61" y="82" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="bold" fill="#FFD000" text-anchor="middle">30</text>
  </g>

  <g font-family="Arial, Helvetica, sans-serif">
    <text x="801" y="432" font-size="18" fill="#AFC0E8" text-anchor="middle">Compatible con relojes Garmin</text>
  </g>
</svg>
